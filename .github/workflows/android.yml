name: Build Android APK

# Builds a free, installable Android APK (debug) on every push to main.
# Direct download link (always the newest build):
#   https://github.com/Fire618/medicine-reminder/releases/latest/download/medicine-reminder.apk
# The web app continues to deploy separately via deploy.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: npm ci

      - name: Build web app
        run: node scripts/build.mjs

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: medicine-reminder-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to Release (stable download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk medicine-reminder.apk
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest medicine-reminder.apk \
            --title "Medicine Reminder (latest)" \
            --notes "Latest build from commit \`${{ github.sha }}\`." \
            --target "${{ github.sha }}"
          echo "Download: https://github.com/Fire618/medicine-reminder/releases/latest/download/medicine-reminder.apk"
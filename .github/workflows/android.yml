name: Build Android APK

# Builds a free, installable Android APK (debug) on every push to main.
# Direct download link (always the newest build):
#   https://github.com/Fire618/medicine-reminder/releases/latest/download/medicine-reminder.apk
# The web app continues to deploy separately via deploy.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Serialize runs: two pushes of the same commit (or a push + manual run)
# otherwise race on the "latest" release/tag and one fails to publish.
concurrency:
  group: build-android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Capacitor 8's android library compiles with --release 21.
          java-version: '21'

      - run: npm ci

      - name: Build web app
        run: node scripts/build.mjs

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: medicine-reminder-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to Release (stable download link)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk medicine-reminder.apk
          # Delete+create the "latest" release, retrying a few times so a
          # lingering release/tag from a previously failed run cannot fail this
          # step. Concurrency above already prevents simultaneous runs racing.
          for i in 1 2 3 4 5; do
            if gh release delete latest --yes --cleanup-tag 2>/dev/null; then
              :
            else
              echo "no existing 'latest' release to delete"
            fi
            if gh release create latest medicine-reminder.apk \
              --title "Medicine Reminder (latest)" \
              --notes "Latest build from commit \`${{ github.sha }}\`." \
              --target "${{ github.sha }}"; then
              echo "Download: https://github.com/Fire618/medicine-reminder/releases/latest/download/medicine-reminder.apk"
              exit 0
            fi
            echo "release create failed (attempt $i), retrying..."
            sleep 5
          done
          echo "giving up publishing after 5 attempts" >&2
          exit 1